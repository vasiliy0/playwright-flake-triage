[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-flake-triage"
version = "0.1.5"
description = "Local read-only triage for flaky Playwright test reports and logs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Playwright Flake Triage contributors" }]
keywords = ["playwright", "flaky-tests", "testing", "ci", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://github.com/vasiliy0/playwright-flake-triage"
Repository = "https://github.com/vasiliy0/playwright-flake-triage"
Issues = "https://github.com/vasiliy0/playwright-flake-triage/issues"

[project.scripts]
pw-flake-triage = "pw_flake_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
